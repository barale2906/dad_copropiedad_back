serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rust_decimal = { workspace = true, features = ["macros"] }
tokio.workspace = true

[lints]
workspace = true
