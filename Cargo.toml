[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["DAD AI & SYSTEMS"]
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
# Crates internos (arquitectura hexagonal: domain ← application ← infra-* ← apps/*)
shared = { path = "crates/shared" }
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infra-postgres = { path = "crates/infra-postgres" }
infra-whatsapp = { path = "crates/infra-whatsapp" }
infra-pdf = { path = "crates/infra-pdf" }
infra-correo = { path = "crates/infra-correo" }

# HTTP / async
axum = { version = "0.8.9", features = ["macros", "ws"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "request-id", "timeout", "util", "limit"] }

# Contrato OpenAPI de la API REST (AGENTS.md §7)
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono", "decimal", "preserve_order", "preserve_path_order"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }

# Serialización
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Base de datos (solo PostgreSQL + rustls, sin OpenSSL)
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "rust_decimal",
    "json",
] }

# Tipos
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }

# Observabilidad / errores / configuración
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
dotenvy = "0.15.7"

# Correo saliente por SMTP (sin OpenSSL: rustls + raíces webpki)
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls-tls"] }

# Criptografía (verificación de firma de webhooks de Meta)
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "warn"
print_stdout = "warn"

[profile.dev]
# Compilación más rápida de dependencias en desarrollo sin perder depuración del código propio
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
