# Despliegue de referencia en el VPS (ver docs/despliegue.md). Nginx (HestiaCP) termina TLS y
# publica la API y el gateway; aquí todo escucha solo en 127.0.0.1.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.produccion run --rm migracion
#   docker compose -f docker-compose.prod.yml --env-file .env.produccion up -d api gateway
#
# La imagen la publica el CI en GHCR (`IMAGEN`, con etiqueta fija: nunca `latest`).
name: dad_copropiedad_prod

x-app: &app
  image: ${IMAGEN:?defina IMAGEN, p. ej. ghcr.io/barale2906/dad_copropiedad_back:sha-abc1234}
  env_file: .env.produccion
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - archivos:/app/datos/archivos

# Los valores por defecto corresponden a un VPS de 4 GB compartido con HestiaCP. Para otro
# tamaño, ajústelos en .env.produccion con la tabla de docs/despliegue.md §9.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # PostgreSQL de fábrica está pensado para una máquina mínima (128 MB de caché): se ajusta
    # a la RAM disponible. `max_connections` cubre los pools de la API y el gateway, los
    # comandos de `dad_admin` y un margen para psql y los respaldos.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-60}
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_wal_size=2GB
      - -c
      - log_min_duration_statement=${PG_LOG_CONSULTAS_LENTAS_MS:-500}
    # Memoria compartida para las consultas paralelas (Docker da 64 MB por defecto).
    shm_size: ${PG_SHM_SIZE:-256mb}
    mem_limit: ${LIMITE_MEMORIA_POSTGRES:-1536m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dad_copropiedad}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}
      TZ: America/Bogota
    volumes:
      - pg_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Paso explícito del despliegue: aplica las migraciones con el dueño del esquema y termina.
  migracion:
    <<: *app
    restart: "no"
    command: ["dad_admin", "migrar"]
    profiles: ["migracion"]

  api:
    <<: *app
    command: ["dad_copropiedad_api"]
    # El pool se comparte entre todas las copropiedades; sobreescribe el de .env.produccion.
    environment:
      DATABASE_MAX_CONNECTIONS: ${API_DB_CONEXIONES:-30}
    mem_limit: ${LIMITE_MEMORIA_API:-512m}
    ports:
      - "127.0.0.1:${API_PUERTO:-8080}:8080"

  gateway:
    <<: *app
    command: ["dad_copropiedad_gateway"]
    environment:
      DATABASE_MAX_CONNECTIONS: ${GATEWAY_DB_CONEXIONES:-15}
    mem_limit: ${LIMITE_MEMORIA_GATEWAY:-512m}
    ports:
      - "127.0.0.1:${GATEWAY_PUERTO:-8081}:8081"

volumes:
  pg_data:
  archivos:
